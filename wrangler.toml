# Cloudflare Workers static-assets deployment for pathways.ke (Pages is now part of Workers).
# Build first with the public Supabase vars exported, then `npx wrangler deploy`:
#   PUBLIC_SUPABASE_URL=… PUBLIC_SUPABASE_ANON_KEY=… npm run build && npx wrangler deploy
# Custom domains below are created (with DNS) on first deploy; the zone pathways.ke is on this account.
name = "pathways-website"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"

routes = [
  { pattern = "pathways.ke", custom_domain = true },
  { pattern = "www.pathways.ke", custom_domain = true },
]
